<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Emote">
    <sdpi-select setting="emote" default="wave">
      <option value="wave">Wave</option>
      <option value="dance">Dance</option>
      <option value="cheer">Cheer</option>
      <option value="clap">Clap</option>
      <option value="bow">Bow</option>
      <option value="salute">Salute</option>
      <option value="laugh">Laugh</option>
      <option value="thank">Thank</option>
      <option value="hello">Hello</option>
      <option value="bye">Goodbye</option>
      <option value="point">Point</option>
      <option value="shrug">Shrug</option>
    </sdpi-select>
  </sdpi-item>
  <p style="font-size:12px;padding:0 12px;color:#ddd">Performs the selected emote once. Requires the DeckBridge addon and an active World of Warcraft window.</p>
</body>
</html>
