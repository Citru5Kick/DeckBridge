name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tracked files and history for credentials
        run: |
          node scripts/check-secrets.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Credential check failed' }
          node scripts/test-secrets.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Credential-check tests failed' }
      - run: npm.cmd ci --ignore-scripts --no-audit --no-fund
      - run: npm.cmd audit --audit-level=high
      - run: |
          & .\node_modules\.bin\tsc.cmd --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
          npm.cmd run build:dev
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          node --check .\com.deckbridge.wow.dev.sdPlugin\bin\plugin.js
          if ($LASTEXITCODE -ne 0) { throw 'JS syntax failed' }
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Mocked tests failed' }
          foreach ($test in @('test-dev-keys','test-live-reader','test-reader-lease','test-game-exit')) {
            powershell.exe -NoProfile -File ("scripts/" + $test + ".ps1")
            if ($LASTEXITCODE -ne 0) { throw $test }
          }
          node scripts/check-dev-package.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Package check failed' }
          node scripts/generate-notices.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Notices failed' }
          node scripts/package-dev-fresh.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
